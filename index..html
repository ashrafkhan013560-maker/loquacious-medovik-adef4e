<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Operation Ten Stages</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #070b14;
      --panel: #111827;
      --accent: #22d3ee;
      --danger: #f43f5e;
      --gold: #facc15;
      --text: #e5e7eb;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(circle at top, #0f172a, var(--bg) 50%);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
    }

    .game-wrap {
      width: min(960px, 100%);
      background: linear-gradient(180deg, #0b1220, #0b1020);
      border: 1px solid #253047;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }

    .hud {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
      padding: 10px;
      background: rgba(17, 24, 39, 0.95);
      border-bottom: 1px solid #253047;
      font-size: 14px;
    }

    .hud div {
      background: #0f172a;
      border: 1px solid #273449;
      border-radius: 8px;
      padding: 8px;
      text-align: center;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      background: linear-gradient(180deg, #0a1120, #090f1b 70%, #111827);
    }

    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      padding: 10px;
      border-top: 1px solid #253047;
      background: #0b1220;
      flex-wrap: wrap;
      font-size: 13px;
    }

    button {
      background: var(--accent);
      color: #03131a;
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 700;
    }

    .note { color: #9ca3af; }
    .disclaimer {
      font-size: 12px;
      color: #94a3b8;
      margin: 0;
      padding: 0 10px 10px;
    }
  </style>
</head>
<body>
  <main class="game-wrap">
    <section class="hud">
      <div>Stage: <strong id="stage">1</strong>/10</div>
      <div>Health: <strong id="health">100</strong></div>
      <div>Score: <strong id="score">0</strong></div>
      <div>Enemies Left: <strong id="remaining">0</strong></div>
      <div>Status: <strong id="status">Ready</strong></div>
    </section>
    <canvas id="game" width="960" height="540"></canvas>
    <section class="controls">
      <span>Move: <b>WASD / Arrow Keys</b> • Shoot: <b>Space</b></span>
      <button id="restart">Restart Campaign</button>
      <span class="note">Campaign theme: America vs Iran style action scenario with 10 stages.</span>
    </section>
    <p class="disclaimer">Fictional arcade simulation for coding/demo use only. Not a real-world military guide.</p>
  </main>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    const ui = {
      stage: document.getElementById('stage'),
      health: document.getElementById('health'),
      score: document.getElementById('score'),
      remaining: document.getElementById('remaining'),
      status: document.getElementById('status')
    };

    const keys = new Set();
    const rand = (min, max) => Math.random() * (max - min) + min;

    let player, bullets, enemies, effects, score, stage, cooldown, gameOver, stageCleared;

    function resetGame() {
      player = { x: 120, y: canvas.height / 2, w: 28, h: 28, speed: 4.4, health: 100 };
      bullets = [];
      enemies = [];
      effects = [];
      score = 0;
      stage = 1;
      cooldown = 0;
      gameOver = false;
      stageCleared = false;
      spawnStage(stage);
      ui.status.textContent = 'Battle Active';
      updateHud();
    }

    function stageConfig(s) {
      const bossStage = s % 5 === 0;
      return {
        total: bossStage ? 1 + s : 4 + s * 2,
        speed: 1 + s * 0.22,
        hp: bossStage ? 70 + s * 14 : 18 + s * 4,
        boss: bossStage
      };
    }

    function spawnStage(s) {
      enemies = [];
      bullets = [];
      const cfg = stageConfig(s);
      for (let i = 0; i < cfg.total; i++) {
        const boss = cfg.boss && i === 0;
        enemies.push({
          x: rand(canvas.width * 0.64, canvas.width - 60),
          y: rand(40, canvas.height - 40),
          w: boss ? 58 : 24,
          h: boss ? 58 : 24,
          hp: boss ? cfg.hp : Math.round(cfg.hp * rand(0.85, 1.35)),
          speed: boss ? cfg.speed * 0.8 : cfg.speed * rand(0.8, 1.4),
          drift: rand(-1, 1),
          boss
        });
      }
      ui.status.textContent = cfg.boss ? `Stage ${s}: Command Unit` : `Stage ${s}: Combat Zone`;
      updateHud();
    }

    function updateHud() {
      ui.stage.textContent = stage;
      ui.health.textContent = Math.max(0, Math.round(player.health));
      ui.score.textContent = score;
      ui.remaining.textContent = enemies.length;
    }

    function shoot() {
      bullets.push({ x: player.x + player.w, y: player.y + player.h / 2 - 2, w: 16, h: 4, speed: 8.5 });
    }

    function hitEffect(x, y, color) {
      effects.push({ x, y, r: 3, alpha: 1, color });
    }

    function handleInput() {
      if ((keys.has('ArrowUp') || keys.has('w')) && player.y > 0) player.y -= player.speed;
      if ((keys.has('ArrowDown') || keys.has('s')) && player.y + player.h < canvas.height) player.y += player.speed;
      if ((keys.has('ArrowLeft') || keys.has('a')) && player.x > 0) player.x -= player.speed;
      if ((keys.has('ArrowRight') || keys.has('d')) && player.x + player.w < canvas.width * 0.55) player.x += player.speed;

      cooldown--;
      if (keys.has(' ') && cooldown <= 0 && !gameOver && !stageCleared) {
        shoot();
        cooldown = 8;
      }
    }

    function update() {
      handleInput();

      bullets.forEach((b) => (b.x += b.speed));
      bullets = bullets.filter((b) => b.x < canvas.width + 20);

      enemies.forEach((e) => {
        e.x -= e.speed;
        e.y += e.drift;
        if (e.y < 0 || e.y + e.h > canvas.height) e.drift *= -1;

        if (e.x < player.x + player.w && e.x + e.w > player.x && e.y < player.y + player.h && e.y + e.h > player.y) {
          player.health -= e.boss ? 14 : 8;
          e.hp = 0;
          hitEffect(player.x + 14, player.y + 14, '#f43f5e');
        }
      });

      bullets.forEach((b) => {
        enemies.forEach((e) => {
          if (b.x < e.x + e.w && b.x + b.w > e.x && b.y < e.y + e.h && b.y + b.h > e.y) {
            e.hp -= 14;
            b.x = canvas.width + 999;
            hitEffect(e.x + e.w / 2, e.y + e.h / 2, e.boss ? '#facc15' : '#22d3ee');
          }
        });
      });

      const defeated = enemies.filter((e) => e.hp <= 0);
      if (defeated.length) score += defeated.reduce((sum, e) => sum + (e.boss ? 250 : 40), 0);
      enemies = enemies.filter((e) => e.hp > 0 && e.x + e.w > -10);

      effects.forEach((fx) => {
        fx.r += 0.7;
        fx.alpha -= 0.04;
      });
      effects = effects.filter((fx) => fx.alpha > 0);

      if (player.health <= 0) {
        gameOver = true;
        ui.status.textContent = 'Mission Failed';
      }

      if (!gameOver && enemies.length === 0 && !stageCleared) {
        stageCleared = true;
        if (stage >= 10) {
          ui.status.textContent = 'Campaign Complete';
          gameOver = true;
        } else {
          ui.status.textContent = `Stage ${stage} Cleared`;
          setTimeout(() => {
            stage += 1;
            stageCleared = false;
            spawnStage(stage);
          }, 900);
        }
      }

      updateHud();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // player
      ctx.fillStyle = '#22d3ee';
      ctx.fillRect(player.x, player.y, player.w, player.h);
      ctx.fillStyle = '#06b6d4';
      ctx.fillRect(player.x + 20, player.y + 9, 16, 10);

      // bullets
      ctx.fillStyle = '#e5e7eb';
      bullets.forEach((b) => ctx.fillRect(b.x, b.y, b.w, b.h));

      // enemies
      enemies.forEach((e) => {
        ctx.fillStyle = e.boss ? '#facc15' : '#f43f5e';
        ctx.fillRect(e.x, e.y, e.w, e.h);

        // hp bar
        const maxHP = stageConfig(stage).hp;
        const hpRatio = Math.max(0, e.hp / maxHP);
        ctx.fillStyle = '#1f2937';
        ctx.fillRect(e.x, e.y - 8, e.w, 5);
        ctx.fillStyle = e.boss ? '#fde047' : '#22d3ee';
        ctx.fillRect(e.x, e.y - 8, e.w * hpRatio, 5);
      });

      // effects
      effects.forEach((fx) => {
        ctx.globalAlpha = fx.alpha;
        ctx.fillStyle = fx.color;
        ctx.beginPath();
        ctx.arc(fx.x, fx.y, fx.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      });

      if (gameOver) {
        ctx.fillStyle = 'rgba(2, 6, 23, 0.75)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#fff';
        ctx.textAlign = 'center';
        ctx.font = 'bold 42px sans-serif';
        ctx.fillText(stage >= 10 && player.health > 0 ? 'VICTORY' : 'MISSION FAILED', canvas.width / 2, canvas.height / 2 - 10);
        ctx.font = '20px sans-serif';
        ctx.fillText(`Final Score: ${score}`, canvas.width / 2, canvas.height / 2 + 30);
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    document.addEventListener('keydown', (e) => keys.add(e.key.toLowerCase()));
    document.addEventListener('keyup', (e) => keys.delete(e.key.toLowerCase()));
    document.getElementById('restart').addEventListener('click', resetGame);

    resetGame();
    loop();
  </script>
</body>
</html>
